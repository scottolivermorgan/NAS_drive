- name: Create directories for Home Assistant
  become: true
  ansible.builtin.file:
    path: "{{ home_assistant.config_dir }}"
    state: directory
    mode: "0755"


- name: Template the docker-compose file
  ansible.builtin.template:
    src: home_assistant_compose/docker-compose.yml.j2
    dest: /home/{{ ansible_env.USER }}/NAS_drive/ansible/tasks/home_assistant_compose/docker-compose.yml


- name: Create and start Home Assistant
  become: true
  community.docker.docker_compose_v2:
    project_src: /home/{{ ansible_env.USER }}/NAS_drive/ansible/tasks/home_assistant_compose
  register: output
