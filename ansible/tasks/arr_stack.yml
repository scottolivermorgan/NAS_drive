# Create directories required by arr's
- name: Create directorys for arr stack storage
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0777'
  loop:
    - /media/{{ mount_point }}/Media/metadata/prowlarr
    - /media/{{ mount_point }}/Media/metadata/sonarr
    - /media/{{ mount_point }}/Media/metadata/radarr
    - /media/{{ mount_point }}/Media/metadata/bazarr
    - /media/{{ mount_point }}/Media/Movies
    - /media/{{ mount_point }}/Media/TV Shows
    - /media/{{ mount_point }}/Media/metadata/qbittorrent
    - /media/{{ mount_point }}/Media/metadata/qbittorrent/appdata
    - /media/{{ mount_point }}/Media/Downloads
    - /media/{{ mount_point }}/Media/Downloads/completed
    - /media/{{ mount_point }}/Media/Downloads/watch


- name: Template the docker-compose file
  template:
    src: arr_stack_compose/docker-compose.yml.j2
    dest: /home/{{ ansible_env.USER }}/NAS_drive/ansible/tasks/arr_stack_compose/docker-compose.yml

# Run arr_stack docker compose
- name: Create and start arr stack
  become: true
  community.docker.docker_compose_v2:
    project_src: /home/{{ ansible_env.USER }}/NAS_drive/ansible/tasks/arr_stack_compose
  register: output

- name: Inspect docker_container_info structure
  become: true
  community.docker.docker_container_info:
    name: qbittorrent
  register: result

- debug:
    var: result

# task wait for good healthcheck returns
- name: Wait for qbittorrent to be healthy
  become: true
  community.docker.docker_container_info:
    name: qbittorrent
  register: result
  until: result.container.State.Health.Status == "healthy"
  retries: 30
  delay: 5

- name: Wait for radarr to be healthy
  become: true
  community.docker.docker_container_info:
    name: radarr
  register: result
  until: result.container.State.Health.Status == "healthy"
  retries: 30
  delay: 5

- name: Wait for sonarr to be healthy
  become: true
  community.docker.docker_container_info:
    name: sonarr
  register: result
  until: result.container.State.Health.Status == "healthy"
  retries: 30
  delay: 5

- name: Wait for prowlarr to be healthy
  become: true
  community.docker.docker_container_info:
    name: prowlarr
  register: result
  until: result.container.State.Health.Status == "healthy"
  retries: 30
  delay: 5

- name: Wait for bazarr to be healthy
  become: true
  community.docker.docker_container_info:
    name: bazarr
  register: result
  until: result.container.State.Health.Status == "healthy"
  retries: 30
  delay: 5

