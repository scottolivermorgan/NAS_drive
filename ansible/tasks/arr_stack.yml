- name: Set qBittorrent connection variables
  set_fact:
    qbittorrent_host: "qbittorrent"
    qbittorrent_port: "{{ ports.qbittorrent_web }}"
    qbittorrent_user: "{{ arr_auth.qbittorrent.username | default('admin') }}"
    qbittorrent_password_configured: "{{ arr_auth.qbittorrent.password | default('') }}"
    # Sonarr reaches qBittorrent over the shared Docker network.


- name: Get qBittorrent logs
  command: docker logs qbittorrent
  register: qbittorrent_logs
  changed_when: false

- name: Parse temporary qBittorrent password
  set_fact:
    qbittorrent_temp_password_parsed: "{{ (qbittorrent_logs.stdout | regex_search('temporary password is provided for this session: (\\S+)', '\\1')) }}"

- name: Try qBittorrent login with configured credentials
  uri:
    url: "http://localhost:{{ ports.qbittorrent_web }}/api/v2/auth/login"
    method: POST
    headers:
      Referer: "http://localhost:{{ ports.qbittorrent_web }}"
    body_format: form-urlencoded
    body:
      username: "{{ qbittorrent_user }}"
      password: "{{ qbittorrent_password_configured }}"
    return_content: yes
    status_code: 200
  register: qbittorrent_login_configured
  failed_when: false
  no_log: true
  when: qbittorrent_password_configured | length > 0

- name: Try qBittorrent login with temporary password
  uri:
    url: "http://localhost:{{ ports.qbittorrent_web }}/api/v2/auth/login"
    method: POST
    headers:
      Referer: "http://localhost:{{ ports.qbittorrent_web }}"
    body_format: form-urlencoded
    body:
      username: "admin"
      password: "{{ qbittorrent_temp_password_parsed[0] }}"
    return_content: yes
    status_code: 200
  register: qbittorrent_login_temp
  failed_when: false
  no_log: true
  when:
    - qbittorrent_password_configured | length == 0 or qbittorrent_login_configured.content | default('') != 'Ok.'

- name: Set qBittorrent API auth facts
  set_fact:
    qbittorrent_api_cookie: >-
      {{
        (
          qbittorrent_login_configured.cookies_string
          if qbittorrent_login_configured is defined and qbittorrent_login_configured.content | default('') == 'Ok.'
          else qbittorrent_login_temp.cookies_string
        )
      }}
    qbittorrent_client_password: >-
      {{
        (
          qbittorrent_password_configured
          if qbittorrent_password_configured | length > 0
          else qbittorrent_temp_password_parsed[0]
        )
      }}
  no_log: true

- name: Fail if qBittorrent login failed
  fail:
    msg: "Could not authenticate to qBittorrent with either the configured credentials or the temporary password."
  when:
    - (qbittorrent_login_configured is not defined or qbittorrent_login_configured.content | default('') != 'Ok.')
    - (qbittorrent_login_temp is not defined or qbittorrent_login_temp.content | default('') != 'Ok.')

- name: Update qBittorrent WebUI credentials
  uri:
    url: "http://localhost:{{ ports.qbittorrent_web }}/api/v2/app/setPreferences"
    method: POST
    headers:
      Referer: "http://localhost:{{ ports.qbittorrent_web }}"
      Cookie: "{{ qbittorrent_api_cookie }}"
    body_format: form-urlencoded
    body:
      json: "{{ {'web_ui_username': qbittorrent_user, 'web_ui_password': qbittorrent_password_configured} | to_json }}"
    status_code: 200
  no_log: true
  when: qbittorrent_password_configured | length > 0

- name: Set qBittorrent client password fact
  set_fact:
    qbittorrent_client_password: "{{ qbittorrent_password_configured if qbittorrent_password_configured | length > 0 else qbittorrent_client_password }}"
  no_log: true

# 2. Get current Sonarr download clients
- name: Get Sonarr download clients
  uri:
    url: "http://localhost:8989/api/v3/downloadclient"
    method: GET
    headers:
      X-Api-Key: "{{ sonarr_api_key }}"
    return_content: yes
    status_code: 200
  register: sonarr_clients_raw

# 3. Parse existing clients into a list
- name: Set Sonarr clients fact
  set_fact:
    sonarr_clients: "{{ sonarr_clients_raw.json | default([]) }}"

- name: Get Sonarr download client schemas
  uri:
    url: "http://localhost:8989/api/v3/downloadclient/schema"
    method: GET
    headers:
      X-Api-Key: "{{ sonarr_api_key }}"
    return_content: yes
    status_code: 200
  register: sonarr_downloadclient_schemas_raw

- name: Set Sonarr qBittorrent schema fact
  set_fact:
    sonarr_qbittorrent_schema: >-
      {{
        (
          sonarr_downloadclient_schemas_raw.json
          | default([])
          | selectattr('implementation', 'defined')
          | selectattr('implementation', 'match', '(?i)^qbittorrent$')
          | list
          | first
        ) | default({})
      }}

- name: Fail if Sonarr qBittorrent schema was not found
  fail:
    msg: "Could not find a qBittorrent entry in Sonarr download client schema response."
  when: sonarr_qbittorrent_schema | length == 0

- name: Build Sonarr qBittorrent payload fields
  set_fact:
    sonarr_qbittorrent_fields: []

- name: Apply qBittorrent values to Sonarr schema fields
  set_fact:
    sonarr_qbittorrent_fields: "{{ sonarr_qbittorrent_fields + [updated_field] }}"
  loop: "{{ sonarr_qbittorrent_schema.fields | default([]) }}"
  vars:
    qb_field_values:
      host: "{{ qbittorrent_host }}"
      port: "{{ qbittorrent_port }}"
      username: "{{ qbittorrent_user }}"
      password: "{{ qbittorrent_client_password }}"
      category: "tv"
      tvCategory: "tv"
      useSsl: false
    updated_field: "{{ item | combine({'value': qb_field_values[item.name]}, recursive=True) if item.name in qb_field_values else item }}"

- name: Build Sonarr qBittorrent payload
  set_fact:
    sonarr_qbittorrent_payload: >-
      {{
        {
          'enable': true,
          'name': 'qBittorrent',
          'implementation': sonarr_qbittorrent_schema.implementation,
          'configContract': sonarr_qbittorrent_schema.configContract,
          'fields': sonarr_qbittorrent_fields
        }
        | combine(
            sonarr_qbittorrent_schema,
            recursive=True
          )
        | combine(
            {
              'enable': true,
              'name': 'qBittorrent',
              'implementation': sonarr_qbittorrent_schema.implementation,
              'configContract': sonarr_qbittorrent_schema.configContract,
              'fields': sonarr_qbittorrent_fields
            },
            recursive=True
          )
      }}

- name: Add qBittorrent to Sonarr if missing
  uri:
    url: "http://localhost:8989/api/v3/downloadclient"
    method: POST
    headers:
      X-Api-Key: "{{ sonarr_api_key }}"
      Content-Type: "application/json"
    body_format: json
    body: "{{ sonarr_qbittorrent_payload }}"
    status_code: 201
  when: "'qBittorrent' not in (sonarr_clients | map(attribute='name') | list)"

- name: Get Radarr download clients
