- name: Build Radarr qBittorrent payload fields
  set_fact:
    radarr_qbittorrent_fields: []

- name: Apply qBittorrent values to Radarr schema fields
  set_fact:
    radarr_qbittorrent_fields: "{{ radarr_qbittorrent_fields + [updated_field] }}"
  loop: "{{ radarr_qbittorrent_schema.fields | default([]) }}"
